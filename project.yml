name: PlacePick
options:
  bundleIdPrefix: com.sianjin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PlacePick:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlacePick
      - path: PlacePickShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sianjin.PlacePick
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PlacePick uses your location to show where you are relative to the places you saved."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PlacePick reads photo dates and locations to help group your photos into Memories."
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: PlacePick/PlacePick.entitlements
    info:
      path: PlacePick/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "PlacePick uses your location to show where you are relative to the places you saved."
        NSPhotoLibraryUsageDescription: "PlacePick reads photo dates and locations to help group your photos into Memories."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - placepick
            CFBundleURLName: com.sianjin.PlacePick
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.sianjin.PlacePick.collection-snapshot
            UTTypeDescription: PlacePick Collection
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - placepickcollection
          - UTTypeIdentifier: com.sianjin.PlacePick.place-identity
            UTTypeDescription: PlacePick Place
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - placepickplace
    dependencies:
      - target: PlacePickShareExtension
        embed: true

  PlacePickShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlacePickShareExtension
      - path: PlacePickShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sianjin.PlacePick.ShareExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: PlacePickShareExtension/PlacePickShareExtension.entitlements
        SKIP_INSTALL: true
    info:
      path: PlacePickShareExtension/Info.plist
      properties:
        CFBundleDisplayName: PlacePick
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.sianjin.PlacePick.collection-snapshot
            UTTypeDescription: PlacePick Collection
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - placepickcollection
          - UTTypeIdentifier: com.sianjin.PlacePick.place-identity
            UTTypeDescription: PlacePick Place
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - placepickplace
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.sianjin.PlacePick.collection-snapshot" OR
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.sianjin.PlacePick.place-identity"
              ).@count > 0).@count > 0

  PlacePickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlacePickTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: PlacePick

schemes:
  PlacePick:
    build:
      targets:
        PlacePick: all
        PlacePickTests: [test]
    test:
      targets:
        - PlacePickTests
    run:
      config: Debug
