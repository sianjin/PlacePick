name: PlacePick
options:
  bundleIdPrefix: com.sianjin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  PlacePick:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlacePick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sianjin.PlacePick
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PlacePick uses your location to show where you are relative to the places you saved."
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: PlacePick/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "PlacePick uses your location to show where you are relative to the places you saved."

  PlacePickTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlacePickTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: PlacePick

schemes:
  PlacePick:
    build:
      targets:
        PlacePick: all
        PlacePickTests: [test]
    test:
      targets:
        - PlacePickTests
    run:
      config: Debug
